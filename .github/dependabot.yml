# Dependabot opens update PRs every Monday morning (US Eastern).
# Patch and minor updates are grouped per ecosystem and auto-merged by
# .github/workflows/dependabot-auto-merge.yml once CI passes; major updates
# get a PR of their own and wait for a human.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps(go)

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    groups:
      # Angular packages must move together, so they share one PR even
      # for majors (ng update style).
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/angular"]
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps(web)

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps(docker)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps(actions)
