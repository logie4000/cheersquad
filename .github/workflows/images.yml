name: Images

# Builds the production image (Go server with the Angular build inside) and
# pushes it to ECR, tagged with the commit SHA and "latest", after CI passes
# on main (or by hand from the Actions tab). Deploy it on the host with:
#   IMAGE_TAG=<sha> deploy/scripts/deploy.sh
#
# Setup (deploy/README.md): an AWS role GitHub can assume, and these
# repository variables (Settings > Secrets and variables > Actions > Variables):
#   AWS_ROLE_ARN           the role, e.g. arn:aws:iam::123456789012:role/cheersquad-github
#   AWS_REGION             e.g. us-east-1
#   COMPOSE_PROJECT_NAME   cheersquad (the ECR repository is <name>-app)

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: images
  cancel-in-progress: false

permissions:
  id-token: write # sign in to AWS with GitHub's OIDC token, no stored keys
  contents: read

jobs:
  push:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      REPO: ${{ vars.COMPOSE_PROJECT_NAME }}-app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create the ECR repository on first use
        run: |
          aws ecr describe-repositories --repository-names "$REPO" >/dev/null 2>&1 ||
            aws ecr create-repository --repository-name "$REPO" \
              --image-scanning-configuration scanOnPush=true >/dev/null

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.REPO }}:${{ env.SHA }}
            ${{ steps.ecr.outputs.registry }}/${{ env.REPO }}:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Summary
        run: echo "Pushed \`$REPO:$SHA\`" >> "$GITHUB_STEP_SUMMARY"
