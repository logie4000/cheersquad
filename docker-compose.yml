services:
  cheersquad:
    build: .
    image: cheersquad:latest
    container_name: cheersquad
    restart: unless-stopped
    # Only reachable from the host; the host Nginx proxies to it.
    ports:
      - "127.0.0.1:8085:8080"
    # Caps the container so a runaway request cannot starve the other sites
    # on the host. GOMEMLIMIT makes the Go GC work harder before the cap.
    mem_limit: ${CHEERSQUAD_MEM_LIMIT:-2g}
    environment:
      GOMEMLIMIT: ${CHEERSQUAD_GOMEMLIMIT:-1800MiB}
      # Subway routing feeds (deploy/scripts/fetch-gtfs.sh). An empty
      # directory is fine: transit falls back to the straight-line estimate.
      GTFS_DIR: /data/gtfs
      # Optional self-hosted OSRM with the foot profile for walking legs;
      # without it walks are straight-line estimates.
      # OSRM_WALK_URL: http://osrm-foot:5000
      # OpenRouteService key: the final plan's legs are street routed and
      # drawn on the map. deploy.sh fills it from SSM; empty means estimates.
      ORS_API_KEY: ${ORS_API_KEY:-}
      # ORS answers are saved here, so they outlive restarts and deploys and
      # repeat plans of a course cost no quota.
      ORS_CACHE_FILE: /data/cache/ors.jsonl
    volumes:
      # ./gtfs is /srv/cheersquad/gtfs on the host.
      - ./gtfs:/data/gtfs:ro
      # A named volume (not a host folder) so the nonroot user can write it.
      - ors-cache:/data/cache

volumes:
  ors-cache:
