services:
  cheersquad:
    build: .
    image: cheersquad:latest
    container_name: cheersquad
    restart: unless-stopped
    # Only reachable from the host; the host Nginx proxies to it.
    ports:
      - "127.0.0.1:8085:8080"
    # Caps the container so a runaway request cannot starve the other sites
    # on the host. GOMEMLIMIT makes the Go GC work harder before the cap.
    mem_limit: ${CHEERSQUAD_MEM_LIMIT:-2g}
    environment:
      GOMEMLIMIT: ${CHEERSQUAD_GOMEMLIMIT:-1800MiB}
      # Subway routing feeds (deploy/scripts/fetch-gtfs.sh). An empty
      # directory is fine: transit falls back to the straight-line estimate.
      GTFS_DIR: /data/gtfs
      # Street routing for walk, bike and drive legs from the osrm-*
      # services below. deploy/scripts/deploy.sh sets these for whichever
      # profiles deploy/scripts/build-osrm.sh has built; without them legs
      # are straight-line estimates.
      OSRM_WALK_URL: ${OSRM_WALK_URL:-}
      OSRM_BIKE_URL: ${OSRM_BIKE_URL:-}
      OSRM_DRIVE_URL: ${OSRM_DRIVE_URL:-}
    volumes:
      # ./gtfs is /srv/cheersquad/gtfs on the host.
      - ./gtfs:/data/gtfs:ro

  # OSRM routers, one per profile, on the data in ./osrm/<profile>. Each runs
  # only when its compose profile is on (COMPOSE_PROFILES, which deploy.sh
  # sets from the profiles built). --mmap serves the files from the page
  # cache instead of copying them into the process; those cached pages count
  # toward mem_limit, so it must be above the profile's data size
  # (du -sh osrm/*) or the router keeps re-reading its files and burns CPU.
  # cpus and --threads keep a busy router from starving the other sites on
  # the host. Only the app reaches them; no ports are published.
  osrm-foot: &osrm
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:v5.27.1}
    container_name: cheersquad-osrm-foot
    profiles: [osrm-foot]
    restart: unless-stopped
    command: osrm-routed --algorithm mld --mmap --threads ${OSRM_THREADS:-2} /data/area.osrm
    mem_limit: ${OSRM_MEM_LIMIT:-2g}
    cpus: ${OSRM_CPUS:-1.0}
    volumes:
      - ./osrm/foot:/data:ro
  osrm-bicycle:
    <<: *osrm
    container_name: cheersquad-osrm-bicycle
    profiles: [osrm-bicycle]
    volumes:
      - ./osrm/bicycle:/data:ro
  osrm-car:
    <<: *osrm
    container_name: cheersquad-osrm-car
    profiles: [osrm-car]
    volumes:
      - ./osrm/car:/data:ro
