# Rate-limit zone for CheerSquad's plan endpoint. limit_req_zone is only
# allowed in the http { } context, so this file goes in /etc/nginx/conf.d/
# (Amazon Linux's nginx.conf includes that directory inside http { }):
#
#   sudo cp /srv/cheersquad/deploy/nginx/cheersquad.http.conf /etc/nginx/conf.d/
#
# 10 MB of state tracks about 160k client IPs. 6 plans a minute per IP, with
# the burst in cheersquad.location.conf, is plenty for someone tweaking a plan.
limit_req_zone $binary_remote_addr zone=cheersquad_plan:10m rate=6r/m;
