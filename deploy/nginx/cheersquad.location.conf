# CheerSquad lives at https://www.specialbrew.net/cheersquad/.
# Paste (or `include`) these blocks inside the existing server { } block for
# www.specialbrew.net on the EC2 host, next to the other sites' locations.
# The rate limit below needs the zone from cheersquad.http.conf, which goes
# in the http { } context (e.g. /etc/nginx/conf.d/).

location = /cheersquad {
    return 301 /cheersquad/;
}

location /cheersquad/ {
    # The trailing slash strips the /cheersquad prefix, so the container
    # sees / and /api/... as if it were at the root.
    proxy_pass http://127.0.0.1:8085/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /cheersquad;
    proxy_read_timeout 60s;

    # Marathon GPX uploads can exceed Nginx's 1 MB default.
    client_max_body_size 20m;
}

# Planning is CPU-heavy, so limit it per client IP. Everything else
# (the UI, the race list) is cheap and stays unlimited.
location = /cheersquad/api/plan {
    limit_req zone=cheersquad_plan burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8085/api/plan;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /cheersquad;
    proxy_read_timeout 60s;
    client_max_body_size 20m;
}
