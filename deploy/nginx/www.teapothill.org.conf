# Host Nginx site for CheerSquad. Copy to /etc/nginx/conf.d/ on the EC2 host,
# then run certbot to add HTTPS (it edits this file in place).

server {
    listen 80;
    listen [::]:80;
    server_name www.teapothill.org;

    # Marathon GPX uploads can exceed Nginx's 1 MB default.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
